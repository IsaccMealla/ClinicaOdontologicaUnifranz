services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica_unifranz_app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www/html
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache-custom.ini:ro
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_CLI_SERVER_WORKERS=4
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=gestion_clinica
      - DB_USERNAME=postgres
      - DB_PASSWORD=admin
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - clinica_network

  pgsql:
    image: postgres:16-alpine
    container_name: clinica_unifranz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_clinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - clinica_pgsql_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_clinica"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - clinica_network

networks:
  clinica_network:
    driver: bridge

volumes:
  clinica_pgsql_data:
    driver: local
